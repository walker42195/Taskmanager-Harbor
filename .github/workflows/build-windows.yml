name: Build Windows Executable

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_NODE_TYPE: node24
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Set up MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.6.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'

    - name: Configure CMake
      run: cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

    - name: Build Executable
      run: cmake --build build --config Release

    - name: Deploy Qt DLL Dependencies
      run: |
        windeployqt --no-compiler-runtime build/Taskmanager-Harbor.exe

    - name: Compress Release Package
      run: |
        Compress-Archive -Path build/* -DestinationPath Taskmanager-Harbor-Windows-x64.zip

    - name: Upload Windows Release Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Taskmanager-Harbor-Windows-x64
        path: Taskmanager-Harbor-Windows-x64.zip
