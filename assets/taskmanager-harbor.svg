<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121624"/>
      <stop offset="100%" stop-color="#0a0c14"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#ff0080"/>
    </linearGradient>

    <!-- Neon Pulse Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#0088ff"/>
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00b0ff"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="24" y="24" width="464" height="464" rx="96" ry="96" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8"/>

  <!-- Inner Subtle Grid Lines -->
  <path d="M 64 160 L 448 160 M 64 256 L 448 256 M 64 352 L 448 352 M 160 64 L 160 448 M 256 64 L 256 448 M 352 64 L 352 448" 
        stroke="#1e2638" stroke-width="2" stroke-dasharray="4 8"/>

  <!-- Background Real-Time Pulse Graph Path -->
  <path d="M 64 320 Q 110 320 130 260 T 190 340 T 256 180 T 320 360 T 380 240 T 448 280" 
        fill="none" stroke="url(#cyanGrad)" stroke-width="5" opacity="0.4" filter="url(#neonGlow)"/>

  <!-- Harbor Anchor / Telemetry Symbol -->
  <g filter="url(#neonGlow)" transform="translate(0, 10)">
    <!-- Anchor Ring / Ring Loop -->
    <circle cx="256" cy="130" r="28" fill="none" stroke="url(#cyanGrad)" stroke-width="12"/>
    <circle cx="256" cy="130" r="12" fill="#00ffff"/>

    <!-- Crossbar / Telemetry Meter -->
    <path d="M 140 200 L 372 200" stroke="url(#greenGrad)" stroke-width="14" stroke-linecap="round"/>
    <circle cx="140" cy="200" r="10" fill="#00e676"/>
    <circle cx="372" cy="200" r="10" fill="#00e676"/>

    <!-- Vertical Shank -->
    <path d="M 256 158 L 256 360" stroke="url(#cyanGrad)" stroke-width="16" stroke-linecap="round"/>

    <!-- Anchor Curved Flukes -->
    <path d="M 130 280 C 130 380, 382 380, 382 280" fill="none" stroke="url(#cyanGrad)" stroke-width="16" stroke-linecap="round"/>

    <!-- Arrow Stock Palms -->
    <path d="M 110 300 L 130 270 L 150 300 Z" fill="#00ffff"/>
    <path d="M 362 300 L 382 270 L 402 300 Z" fill="#00ffff"/>

    <!-- Base Crown Point -->
    <path d="M 240 375 L 256 395 L 272 375 Z" fill="#00e676"/>
  </g>
</svg>
