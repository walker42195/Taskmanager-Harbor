<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- GPU Board Frame -->
  <rect x="8" y="14" width="48" height="34" rx="4" fill="#141824" stroke="#7c4dff" stroke-width="3"/>
  
  <!-- PCIe Connector Teeth -->
  <rect x="14" y="48" width="16" height="5" fill="#ffb74d" rx="1"/>
  <rect x="34" y="48" width="16" height="5" fill="#ffb74d" rx="1"/>
  
  <!-- Dual Cooling Fans -->
  <circle cx="23" cy="31" r="9" fill="#1e2436" stroke="#7c4dff" stroke-width="2"/>
