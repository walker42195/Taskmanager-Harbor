  <path d="M 23 22 L 23 40 M 14 31 L 32 31" stroke="#7c4dff" stroke-width="1.5" stroke-linecap="round"/>
  
  <circle cx="41" cy="31" r="9" fill="#1e2436" stroke="#7c4dff" stroke-width="2"/>
